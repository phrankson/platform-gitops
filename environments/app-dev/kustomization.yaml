# Root Kustomization for the app-dev environment.
# Argo CD's App of Apps points here (folder-based, not a branch -- this
# repo has one branch, main; environments are separated by path).
# Stamps every rendered resource with env=app-dev, then pulls in the tenants/
# folder, which is where each tenant onboards by adding their own subfolder.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      env: app-dev
    includeSelectors: true
    includeTemplates: true

resources:
  - tenants
